<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#shieldGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Eco Leaf / Shield Emblem -->
  <g filter="url(#glow)" transform="translate(56, 56)">
    <!-- Shield Outline -->
    <path d="M200 40 L340 90 C340 230 250 320 200 360 C150 320 60 230 60 90 Z" fill="none" stroke="#34d399" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Central Stylized Leaf -->
    <path d="M200 90 C200 90 280 140 270 230 C260 300 200 320 200 320 C200 320 140 300 130 230 C120 140 200 90 200 90 Z" fill="url(#ecoGrad)" />
    
    <!-- Leaf Center Stem & Veins -->
    <path d="M200 120 L200 300" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
    <path d="M200 170 Q235 155 245 140" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" />
    <path d="M200 210 Q165 195 155 180" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" />
    <path d="M200 245 Q235 235 245 220" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" />

    <!-- Sparkle Stars -->
    <circle cx="80" cy="70" r="10" fill="#34d399" />
    <circle cx="320" cy="70" r="10" fill="#34d399" />
  </g>
</svg>
